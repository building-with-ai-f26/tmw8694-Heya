# Render Blueprint for Heya Wrapped (app/server.py). See AGENTS.md > Deploy.
services:
  - type: web
    name: heya-wrapped
    runtime: python
    plan: free
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python3 app/server.py
    healthCheckPath: /healthz
    autoDeploy: true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: HOST
        value: 0.0.0.0
      - key: OPENROUTER_API_KEY
        sync: false # secret: Render asks for it in the dashboard; never put it in this file
      - key: HEYA_MODEL
        value: anthropic/claude-haiku-5.5
      - key: RATE_LIMIT_PER_VISITOR
        value: "10"
      - key: RATE_WINDOW_SECONDS
        value: "600"
      - key: DAILY_AI_CAP
        value: "300"
